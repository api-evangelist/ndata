aid: ndata
name: Ndata
description: 'nData (ndata.cz) is a European pharmaceutical software company operating since 2005 that
  builds GxP-compliant, AI-assisted systems for the pharma lifecycle: portfolio and project management
  (ePM), regulatory affairs (eRA), quality control planning (eQCP), artwork and packaging management
  (eAW), controlled documentation (eDOCS), clinical trial documentation / eTMF, plus eLAB (R&D lab
  operations), and eGO and eTRANSFER (launching Q3/2026). Its public web presence is a marketing and
  product-catalog site; nData publishes no public API, SDK, developer portal, or machine-readable
  specifications. Note: this repo was seeded as a bain-capital-ventures ai-infrastructure portfolio
  stub, but the ndata.cz surface is a pharmaceutical GxP software vendor — the portfolio match appears
  to be a mismatch.'
